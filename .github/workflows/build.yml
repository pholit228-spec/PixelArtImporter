name: Build Geode mod

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Win64
            os: windows-latest
          - target: MacOS
            os: macos-latest
          - target: Android32
            os: ubuntu-latest
          - target: Android64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
      - name: Upload platform build
        uses: actions/upload-artifact@v4
        with:
          name: PixelArtImporter-${{ matrix.target }}
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
